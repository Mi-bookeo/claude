<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E4FB8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D2B0"/><stop offset="1" stop-color="#EDB98F"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF3FA"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <ellipse cx="300" cy="835" rx="150" ry="18" fill="#000" opacity="0.10"/>

  <!-- back hair (curly volume) -->
  <g fill="#6B3E22">
    <circle cx="300" cy="205" r="100"/>
    <circle cx="214" cy="250" r="44"/><circle cx="386" cy="250" r="44"/>
    <circle cx="212" cy="300" r="40"/><circle cx="388" cy="300" r="40"/>
    <circle cx="224" cy="345" r="34"/><circle cx="376" cy="345" r="34"/>
    <circle cx="206" cy="200" r="40"/><circle cx="394" cy="200" r="40"/>
    <circle cx="236" cy="140" r="42"/><circle cx="364" cy="140" r="42"/>
    <circle cx="300" cy="115" r="46"/>
  </g>
  <g fill="none" stroke="#8E5631" stroke-width="7" stroke-linecap="round">
    <path d="M184 250 q12 -16 24 0"/><path d="M186 302 q12 -16 24 0"/>
    <path d="M202 350 q11 -14 22 0"/><path d="M392 250 q12 -16 24 0"/>
    <path d="M390 302 q12 -16 24 0"/><path d="M376 350 q11 -14 22 0"/>
  </g>

  <!-- legs -->
  <rect x="256" y="660" width="30" height="150" rx="16" fill="url(#skin)"/>
  <rect x="314" y="660" width="30" height="150" rx="16" fill="url(#skin)"/>
  <!-- shoes -->
  <path d="M244 805 q0 -16 16 -16 h26 q8 0 8 10 v14 h-50z" fill="#1F2937"/>
  <path d="M306 799 q0 -10 8 -10 h26 q16 0 16 16 v8 h-50z" fill="#1F2937"/>

  <!-- arms -->
  <path d="M232 365 q-34 90 -36 190" stroke="url(#skin)" stroke-width="27" stroke-linecap="round" fill="none"/>
  <path d="M368 365 q34 90 36 190" stroke="url(#skin)" stroke-width="27" stroke-linecap="round" fill="none"/>
  <circle cx="196" cy="562" r="17" fill="#EDB98F"/>
  <circle cx="404" cy="562" r="17" fill="#EDB98F"/>

  <!-- neck -->
  <rect x="280" y="300" width="40" height="55" rx="10" fill="#EDB98F"/>

  <!-- dress -->
  <path d="M240 350 Q300 370 360 350 Q380 360 376 420 L370 480 Q420 600 432 690 Q300 722 168 690 Q180 600 230 480 L224 420 Q220 360 240 350Z" fill="url(#dress)"/>
  <!-- neckline -->
  <path d="M262 352 Q300 395 338 352" fill="#EDB98F"/>
  <path d="M258 350 Q300 402 342 350" fill="none" stroke="#1A43A0" stroke-width="5"/>
  <!-- waist belt -->
  <path d="M228 478 Q300 496 372 478 L374 496 Q300 514 226 496Z" fill="#1A3A8C"/>
  <!-- skirt folds -->
  <g stroke="#1A43A0" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M255 510 Q245 600 232 698"/><path d="M300 515 L300 705"/><path d="M345 510 Q355 600 368 698"/>
  </g>
  <!-- puff sleeves -->
  <ellipse cx="232" cy="372" rx="29" ry="26" fill="#2F6FE0"/>
  <ellipse cx="368" cy="372" rx="29" ry="26" fill="#2F6FE0"/>
  <!-- dress highlight -->
  <path d="M252 382 Q248 430 246 470" stroke="#fff" stroke-width="6" opacity="0.25" stroke-linecap="round" fill="none"/>

  <!-- ears -->
  <ellipse cx="222" cy="240" rx="14" ry="20" fill="#EDB98F"/>
  <ellipse cx="378" cy="240" rx="14" ry="20" fill="#EDB98F"/>
  <!-- face -->
  <ellipse cx="300" cy="230" rx="80" ry="90" fill="url(#skin)"/>

  <!-- fringe curls -->
  <g fill="#6B3E22">
    <circle cx="245" cy="162" r="30"/><circle cx="285" cy="150" r="30"/>
    <circle cx="325" cy="150" r="30"/><circle cx="360" cy="165" r="28"/>
    <circle cx="225" cy="195" r="22"/><circle cx="378" cy="197" r="22"/>
  </g>
  <g fill="none" stroke="#8E5631" stroke-width="6" stroke-linecap="round">
    <path d="M232 168 q12 -14 24 0"/><path d="M272 156 q12 -14 24 0"/>
    <path d="M314 156 q12 -14 24 0"/><path d="M350 170 q10 -12 20 0"/>
  </g>

  <!-- black headband -->
  <path d="M206 175 Q300 70 394 175" fill="none" stroke="#111111" stroke-width="20" stroke-linecap="round"/>
  <path d="M232 140 Q300 92 368 140" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- eyebrows -->
  <path d="M250 205 q18 -10 34 -2" stroke="#5A321B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M316 203 q16 -8 34 2" stroke="#5A321B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="268" cy="236" rx="13" ry="16" fill="#2B1A10"/>
  <ellipse cx="332" cy="236" rx="13" ry="16" fill="#2B1A10"/>
  <circle cx="273" cy="230" r="5" fill="#fff"/><circle cx="337" cy="230" r="5" fill="#fff"/>
  <circle cx="264" cy="242" r="2.5" fill="#fff"/><circle cx="328" cy="242" r="2.5" fill="#fff"/>
  <!-- lashes -->
  <path d="M254 226 l-6 -5" stroke="#2B1A10" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M346 226 l6 -5" stroke="#2B1A10" stroke-width="3.5" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M300 250 q-6 14 2 18" stroke="#D99A70" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="248" cy="270" rx="15" ry="9" fill="#F28B8B" opacity="0.45"/>
  <ellipse cx="352" cy="270" rx="15" ry="9" fill="#F28B8B" opacity="0.45"/>
  <!-- smile -->
  <path d="M276 284 Q300 308 324 284 Q300 296 276 284Z" fill="#B8434A"/>
  <path d="M283 287 Q300 294 317 287" fill="#fff" opacity="0.9"/>
</svg>
